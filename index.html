<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E">
<title>ぽんぽんあそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap">
<style>
  /* Layout: 画面いっぱいのあそび場。ホームの大きなタイルから16のあそびへ。子どもは触るだけ。 */
  :root {
    --paper: #FFF6E0;
    --ink: #2B3A67;
    --sky-top: #8FD6FF;
    --sky-bot: #E6F7FF;
    --coral: #FF6F61;
    --sun: #FFC83D;
    --mint: #3CCFB4;
    --grape: #8F6BF2;
    --berry: #FF5FA2;
    --sea: #35A7FF;
    --card-yellow: #FFE48A;
    --card-pink: #FFC4DA;
    --card-mint: #B6F0E3;
    --card-blue: #BFE3FF;
    --card-lilac: #DCCFFF;
    --card-peach: #FFD2B3;
    --canvas-paper: #FFFDF6;
    --shadow: rgba(43, 58, 103, 0.18);
    --top: 76px;
    --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --font-abc: "Fredoka", "Arial Rounded MT Bold", "M PLUS Rounded 1c", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 800;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  :focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }

  .stages { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .stage {
    position: absolute; inset: 0;
    border-radius: 30px;
    overflow: hidden;
    touch-action: none;
  }

  /* ホーム */
  #home { background: #FFF1C9; }
  .homegrid {
    position: absolute; inset: 0;
    display: grid; gap: 10px; padding: var(--top) 10px 10px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }
  .tile {
    min-width: 0; min-height: 0; padding: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 0; border-radius: 24px;
    background: var(--c); color: var(--fg, var(--ink));
    box-shadow: 0 5px 0 var(--shadow);
  }
  @media (min-aspect-ratio: 4/3) {
    .homegrid { grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(2, 1fr); }
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
  .tile .ico { font-size: clamp(36px, min(12vw, 8vh), 84px); line-height: 1; }
  .tile .lab { font-size: clamp(11px, 2.9vw, 20px); line-height: 1.15; text-align: center; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; padding: 0 2px; }

  /* ふうせん */
  #stage-sky {
    background:
      radial-gradient(ellipse 80px 28px at 18% 16%, rgba(255,255,255,.9) 62%, transparent 64%),
      radial-gradient(ellipse 110px 34px at 78% 30%, rgba(255,255,255,.9) 62%, transparent 64%),
      radial-gradient(ellipse 90px 30px at 34% 66%, rgba(255,255,255,.85) 62%, transparent 64%),
      radial-gradient(ellipse 120px 36px at 84% 82%, rgba(255,255,255,.85) 62%, transparent 64%),
      linear-gradient(var(--sky-top), var(--sky-bot));
  }
  .balloon { position: absolute; left: 0; top: 0; width: var(--s); height: calc(var(--s) * 1.2); will-change: transform; cursor: pointer; }
  .balloon .body {
    position: relative; width: 100%; height: 100%;
    border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    background: var(--c);
    box-shadow: inset -10px -14px 0 rgba(43, 58, 103, 0.10);
  }
  .balloon .body::before {
    content: ""; position: absolute; left: 20%; top: 14%; width: 22%; height: 30%;
    border-radius: 50%; background: rgba(255,255,255,.55); transform: rotate(22deg);
  }
  .balloon .body::after {
    content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 12px solid var(--c);
  }
  .balloon .string {
    position: absolute; left: 50%; top: calc(100% + 11px); width: 3px; height: 64px; margin-left: -1px;
    background: rgba(43, 58, 103, 0.35); border-radius: 2px;
  }

  /* どうぶつ */
  #stage-zoo { background: #FFF1C9; }
  .zoo {
    position: absolute; inset: 0;
    display: grid; gap: 12px; padding: var(--top) 12px 12px;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
  }
  @media (min-aspect-ratio: 4/3) {
    .zoo { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; padding-top: 12px; padding-left: 80px; }
  }
  .card {
    position: relative; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 0; border-radius: 26px;
    background: var(--c);
    box-shadow: 0 6px 0 var(--shadow);
  }
  .card .emoji { font-size: clamp(56px, min(24vw, 14vh), 124px); line-height: 1; }
  .card .name { font-size: 16px; letter-spacing: .08em; }
  .card .say {
    position: absolute; top: 8px; left: 50%;
    padding: 4px 16px; border-radius: 999px;
    background: #fff; font-size: 24px; white-space: nowrap;
    box-shadow: 0 3px 0 var(--shadow);
    pointer-events: none;
  }

  /* おえかき */
  #stage-paint { background: var(--canvas-paper); box-shadow: inset 0 0 0 4px #F2E6C8; display: flex; flex-direction: column; }
  .paintwrap { position: relative; flex: 1; min-height: 0; }
  #paper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .palette {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 8px;
    padding: 10px 6px 12px;
    background: #fff; border-top: 4px solid #F2E6C8;
  }
  .sw {
    flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%;
    border: 0; background: var(--c);
    box-shadow: 0 3px 0 var(--shadow);
    transition: transform .15s;
  }
  .sw.rainbow { background: conic-gradient(#F2463C, #FFD21F, #34B556, #2F7BF5, #9358E0, #F2463C); }
  .sw.on { transform: scale(1.2); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); z-index: 2; position: relative; }

  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .fx span { position: absolute; left: 0; top: 0; will-change: transform, opacity; line-height: 1; }
  .fx .dot { width: 14px; height: 14px; border-radius: 50%; margin: -7px 0 0 -7px; }
  .fx .fly { font-size: 56px; margin: -28px 0 0 -28px; }
  .fx .word { font-size: 32px; color: var(--ink); margin: -16px 0 0 -40px; white-space: nowrap; text-shadow: 0 2px 0 #fff; }

  /* 上のボタン */
  .tools { position: absolute; top: 12px; right: 12px; z-index: 6; display: flex; gap: 10px; }
  .tool {
    width: 56px; height: 56px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.95); font-size: 28px; line-height: 1;
    box-shadow: 0 3px 0 var(--shadow);
    display: grid; place-items: center;
  }
  .tool:active { transform: translateY(2px); }
  .tool { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .tool.lp::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: conic-gradient(var(--grape) calc(var(--p, 0) * 1turn), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
  }
  .tool.lp.hold::after { opacity: 1; }
  .homebtn { position: absolute; top: 12px; left: 12px; z-index: 6; }

  /* 大きなことば */
  #bigword {
    position: absolute; left: 0; top: 40%; z-index: 8; pointer-events: none;
    transform: translate(0, -50%);
    font-size: clamp(48px, 17vw, 130px); line-height: 1.1; text-align: center; white-space: pre; width: 100%;
    -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(43,58,103,.25);
    opacity: 0;
  }
  .sayline {
    position: absolute; top: 12px; left: 80px; right: 80px; height: 56px; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(26px, 8vw, 44px); white-space: nowrap; pointer-events: none;
  }

  /* いろタッチ */
  #stage-touch { background: #FFF6E0; }
  #ripples { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #ripples div { position: absolute; border-radius: 50%; will-change: transform; }
  .blobs {
    position: absolute; inset: 0; z-index: 1;
    display: grid; gap: 12px; padding: var(--top) 12px 12px;
    grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr);
  }
  @media (min-aspect-ratio: 4/3) {
    .blobs { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; padding-top: 12px; padding-left: 80px; }
  }
  .blob {
    min-width: 0; min-height: 0; border: 0; background: var(--c); color: var(--fg);
    font-size: clamp(20px, 6vw, 32px);
    box-shadow: inset -12px -16px 0 rgba(0,0,0,.12), inset 10px 10px 0 rgba(255,255,255,.18), 0 6px 0 var(--shadow);
  }

  /* いろさがし */
  #stage-find { background: #E8F6FF; display: flex; flex-direction: column; padding-top: var(--top); }
  .stars { min-height: 36px; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 0 8px; font-size: 24px; line-height: 1.2; }
  .ask { text-align: center; font-size: clamp(34px, 10vw, 64px); padding: 6px 8px; color: var(--ink); white-space: nowrap; }
  .choices { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 16px; padding: 8px 12px 16px; }
  .ball {
    flex: 0 0 auto; width: var(--bs); height: var(--bs); border-radius: 50%; border: 0;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.7) 0 10%, transparent 11%), var(--c);
    box-shadow: inset -10px -14px 0 rgba(43,58,103,.14), 0 6px 0 var(--shadow);
    --bs: clamp(96px, min(40vw, 21vh), 190px);
  }

  /* かぞえよう */
  #stage-count { background: #FFF9D6; }
  #items { position: absolute; inset: 0; }
  .item {
    position: absolute; border: 0; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.65); line-height: 1;
    display: grid; place-items: center;
    transition: background .2s, filter .2s;
  }
  .item.counted { background: #fff; filter: brightness(1.12) saturate(1.1); }
  .badge {
    position: absolute; top: -8px; right: -8px; min-width: 40px; height: 40px; padding: 0 6px;
    border-radius: 20px; background: var(--ink); color: #fff; font-size: 26px; line-height: 40px; text-align: center;
    box-shadow: 0 3px 0 var(--shadow); pointer-events: none;
  }

  /* すうじ */
  #stage-num { background: #EAF8EE; display: flex; flex-direction: column; }
  .numtop { flex: 1 1 0; min-height: 0; padding-top: 64px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; overflow: hidden; }
  .bignum { font-size: clamp(64px, min(22vw, 13vh), 150px); line-height: 1; color: var(--ink); min-height: 1em; }
  .starsarea { width: 100%; max-width: 380px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 12px; }
  .starsarea span { text-align: center; line-height: 1.15; font-size: clamp(30px, min(10vw, 7vh), 60px); opacity: 0; }
  .numpad {
    flex: 1.15 1 0; min-height: 0; padding: 12px;
    display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
  }
  .numpad .nb:last-child { grid-column: 1 / -1; }
  @media (min-aspect-ratio: 4/3) {
    .numpad { grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; }
    .numpad .nb:last-child { grid-column: auto; }
    .numtop { padding-top: 12px; }
  }
  .nb {
    min-width: 0; min-height: 0; border: 0; border-radius: 24px; background: var(--c); color: var(--fg);
    font-size: clamp(36px, 9vh, 72px); line-height: 1;
    box-shadow: 0 5px 0 var(--shadow);
  }
  .nb:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }

  /* いないいないばあ */
  #stage-baa { background: #FFE9F1; }
  .baa {
    position: absolute; inset: 0;
    display: grid; gap: 12px; padding: var(--top) 12px 12px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  @media (min-aspect-ratio: 4/3) {
    .baa { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; padding-top: 80px; }
  }
  .slot {
    position: relative; min-width: 0; min-height: 0; padding: 0; border: 0; overflow: hidden;
    border-radius: 24px; background: #FFF6D8; box-shadow: 0 6px 0 var(--shadow);
  }
  .slot .an {
    position: absolute; left: 0; right: 0; top: 46%; text-align: center; line-height: 1;
    font-size: clamp(64px, min(22vw, 13vh), 130px);
    opacity: 0; transform: translateY(-20%) scale(.2);
    transition: opacity .15s, transform .15s;
  }
  .slot .nm { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 26px; opacity: 0; transition: opacity .15s; }
  .slot .cur {
    position: absolute; inset: 0; background: var(--c);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 14px, rgba(0,0,0,.05) 14px 28px);
    display: grid; place-items: center; font-size: 56px;
    border-bottom: 8px solid rgba(0,0,0,.15);
    transition: transform .5s ease;
  }
  .slot.open .cur { transform: translateY(-102%); }
  .slot.open .an { opacity: 1; transform: translateY(-50%) scale(1); transition: opacity .2s .25s, transform .45s cubic-bezier(.3,1.6,.5,1) .25s; }
  .slot.open .nm { opacity: 1; transition: opacity .2s .7s; }


  /* ことば（ゲーム内の補助表示） */
  .say2 { min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 8px; font-size: clamp(20px, 6vw, 34px); line-height: 1.2; pointer-events: none; }

  /* おみせやさん */
  #stage-shop {
    --rowh: clamp(80px, 11vh, 120px); --shelfh: calc(var(--rowh) * 4 + 28px);
    background: #DDF6EC; display: flex; flex-direction: column;
  }
  @media (min-aspect-ratio: 1/1) { #stage-shop { flex-direction: row; } }
  .reg { flex: 1 1 0; min-height: 0; min-width: 0; padding: 6px 10px 6px; display: flex; flex-direction: column; gap: 6px; }
  .regbody {
    flex: 1; min-height: 0; min-width: 0; overflow: hidden; padding: 8px; border-radius: 22px;
    background: #BDEFDC; box-shadow: 0 5px 0 var(--shadow), inset 0 0 0 4px #fff;
    display: flex; flex-direction: column; gap: 6px;
  }
  /* スキャナー窓: いちばん上（🏠 の となり）。かめらが つかえるときは、窓のなかに ライブえいぞうを うつす */
  .scanbox { position: relative; flex: 0 0 auto; margin-left: 62px; padding: 0; }
  .scanbox[data-arr="top"] { padding-top: 46px; }
  .scanbox[data-arr="bottom"] { padding-bottom: 46px; }
  .scanbox[data-arr="left"] { padding-left: 46px; }
  .scanbox[data-arr="right"] { padding-right: 46px; }
  .scanwin {
    position: relative; width: 100%; height: clamp(72px, 10.5vh, 104px); min-width: 0; overflow: hidden; cursor: pointer;
    border-radius: 16px; border: 4px solid var(--bc, #fff);
    background: linear-gradient(#18202E, #2D3E58); box-shadow: var(--bs, inset 0 0 0 3px #8795AA, 0 3px 0 var(--shadow));
    transition: background .15s, border-color .1s; touch-action: manipulation;
  }
  .scanwin.live { background: #101826; }
  .scanwin video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; pointer-events: none; }
  .scanwin .cbox { position: absolute; left: 20%; right: 20%; top: 15%; bottom: 15%; border: 3px dashed rgba(255,255,255,.95); border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.2); }
  .scanwin.ok { --bc: #34D96A; background: linear-gradient(#1F7A3F, #49D17A); box-shadow: 0 0 0 3px #CFFFD9, 0 0 26px 10px rgba(52,217,106,.9) !important; }
  .scanwin.live.ok { background: #101826; }
  .laser {
    position: absolute; left: 6%; right: 6%; top: 50%; height: 4px; border-radius: 2px; pointer-events: none;
    background: #FF2D2D; box-shadow: 0 0 10px 3px rgba(255,45,45,.75);
    animation: laser 1.8s ease-in-out infinite alternate;
  }
  @keyframes laser { from { top: 18%; } to { top: 78%; } }
  @media (prefers-reduced-motion: reduce) { .laser { animation: none; } .camarrows .ar { animation: none !important; opacity: 1 !important; } }
  .scanlbl { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 11px; color: rgba(255,255,255,.55); letter-spacing: .1em; pointer-events: none; }
  .scanwin.live .scanlbl { display: none; }
  /* 本物のカメラの方向を さす やじるし */
  .camarrows { position: absolute; inset: 0; pointer-events: none; z-index: 2; --rot: 0deg; --dx: 0px; --dy: -9px; }
  .camarrows .grp { position: absolute; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .camarrows[data-pos="top"] .grp { left: 0; right: 0; top: 0; height: 46px; }
  .camarrows[data-pos="bottom"] .grp { left: 0; right: 0; bottom: 0; height: 46px; }
  .camarrows[data-pos="left"] .grp { left: 0; top: 0; bottom: 0; width: 46px; flex-direction: column; }
  .camarrows[data-pos="right"] .grp { right: 0; top: 0; bottom: 0; width: 46px; flex-direction: column; }
  .camarrows[data-pos="right"] { --rot: 90deg; --dx: 9px; --dy: 0px; }
  .camarrows[data-pos="bottom"] { --rot: 180deg; --dx: 0px; --dy: 9px; }
  .camarrows[data-pos="left"] { --rot: -90deg; --dx: -9px; --dy: 0px; }
  .camarrows .ar { display: inline-block; font-size: 28px; line-height: 1; font-style: normal; transform: rotate(var(--rot)); animation: arw 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * .18s); }
  @keyframes arw { 0%, 100% { transform: translate(0, 0) rotate(var(--rot)); opacity: .3; } 50% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 1; } }
  .camlbl { flex: 0 0 auto; padding: 2px 10px; border-radius: 14px; background: #fff; color: var(--ink); font-size: clamp(13px, 3.8vw, 18px); line-height: 1.3; white-space: nowrap; box-shadow: 0 2px 0 var(--shadow); }
  .camarrows[data-pos="left"] .camlbl, .camarrows[data-pos="right"] .camlbl { position: absolute; top: 6px; font-size: 12px; padding: 1px 8px; z-index: 3; }
  .camarrows[data-pos="left"] .camlbl { left: 54px; }
  .camarrows[data-pos="right"] .camlbl { right: 54px; }
  @media (max-width: 420px) { .camarrows .ar.a3 { display: none; } }
  .lcd {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 12px; background: #0F3B27; color: #8CFFA0;
    font-family: "Courier New", ui-monospace, monospace; font-weight: 700; text-shadow: 0 0 6px rgba(76,255,122,.7);
    box-shadow: inset 0 0 0 3px #1D5A3C; line-height: 1.2;
  }
  .lcd .l1 { display: flex; gap: 8px; align-items: center; font-size: clamp(17px, 5vw, 26px); white-space: nowrap; overflow: hidden; }
  .lcd .l1 .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: clip; }
  .lcd .l2 { font-size: clamp(12px, 3.4vw, 16px); min-height: 1.2em; opacity: .85; white-space: nowrap; overflow: hidden; }
  .lcd .l3 { display: flex; justify-content: space-between; font-size: clamp(16px, 4.6vw, 24px); white-space: nowrap; }
  .lcd .l3.blink { animation: blink .4s steps(2, end) 4; }
  @keyframes blink { 50% { opacity: .15; } }
  .regbottom { flex: 1 1 auto; min-height: 80px; display: flex; gap: 8px; }
  .basket {
    flex: 1; min-width: 0; padding: 4px 6px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 3px #E4D9B8;
    display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: flex-start;
    font-size: clamp(22px, 6vw, 34px); line-height: 1.1; overflow: hidden;
  }

  .ai-tb, .ai-back { position: absolute; top: 8px; right: 8px; z-index: 3; min-height: 56px; min-width: 56px; padding: 0 16px; border: 0; border-radius: 28px; background: #fff; font-size: 18px; box-shadow: 0 4px 0 var(--shadow), 0 0 0 3px #F2E6C8; }
  .ai-tb:active, .ai-back:active { transform: translateY(2px); }
  .ai-trace { position: absolute; inset: 0; border-radius: 28px; background: #fff; box-shadow: 0 6px 0 var(--shadow), inset 0 0 0 5px #F2E6C8; overflow: hidden; z-index: 2; }
  .ai-tl { position: absolute; inset: 0; display: grid; place-items: center; line-height: 1; color: #DADFE8; pointer-events: none; }
  #ai-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ai-done { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; min-width: 170px; min-height: 68px; padding: 0 24px; border: 0; border-radius: 34px; background: #34B556; color: #fff; font-size: 28px; box-shadow: 0 5px 0 var(--shadow); }
  .ai-done:active { transform: translateX(-50%) translateY(3px); }
  .ai-ctl { flex: 0 0 auto; min-width: 0; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ai-strip { display: flex; align-items: center; gap: 6px; height: 56px; }
  .ai-arrow { flex: 0 0 auto; width: 52px; height: 52px; border: 0; border-radius: 50%; background: #fff; font-size: 24px; line-height: 1; box-shadow: 0 3px 0 var(--shadow); display: grid; place-items: center; }
  .ai-tabs { position: relative; flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; padding: 4px 2px 6px; }
  .ai-tabs::-webkit-scrollbar { display: none; }
  .ai-tab { flex: 0 0 auto; width: 48px; height: 48px; border: 0; border-radius: 14px; background: var(--c); color: var(--fg); font-size: 24px; line-height: 1; box-shadow: 0 3px 0 var(--shadow); }
  .ai-tab.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
  .ai-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .ai-b {
    flex: 0 0 calc((100% - 20px) / 3); height: clamp(76px, 12vh, 120px); border: 0; border-radius: 24px; padding: 0;
    background: var(--c); color: var(--fg); font-size: clamp(40px, min(13vw, 7vh), 76px); line-height: 1;
    box-shadow: 0 5px 0 var(--shadow);
  }
  .ai-b:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .ai-b.on { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); }
  @media (min-width: 600px) and (max-aspect-ratio: 13/10) { .ai-b { flex-basis: calc((100% - 40px) / 5); } }
  @media (min-aspect-ratio: 4/3) {
    #stage-aiueo { flex-direction: row; padding: 12px 12px 12px 80px; }
    .ai-top { flex: 1 1 0; margin: 0; }
    .ai-ctl { flex: 1 1 0; padding: 64px 0 0 12px; justify-content: center; }
    .ai-btns { justify-content: center; }
  }

  /* ABCパズル（木のアルファベットはめこみ） */
  #stage-abc {
    --cs: 100px; --fs: 78px; --ps: 100px; --pfs: 78px; --gap: 8px; --pgap: 8px;
    background: #F1D7A2 repeating-linear-gradient(0deg, rgba(150,100,40,.09) 0 3px, transparent 3px 72px);
    display: flex; flex-direction: column; padding-top: var(--top); font-family: var(--font-abc); font-weight: 700;
  }
  .abc-nav { flex: 0 0 auto; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .abc-range { min-width: 64px; text-align: center; font-size: 22px; color: #7A5527; }
  .abc-board {
    position: relative; z-index: 1; align-self: center; flex: 0 0 auto; padding: 14px; border-radius: 28px;
    background:
      repeating-linear-gradient(92deg, rgba(139,94,40,.10) 0 3px, transparent 3px 11px, rgba(255,255,255,.14) 11px 13px, transparent 13px 29px),
      linear-gradient(#F2DFBF, #E8D0A6);
    background-color: #EED9B7;
    box-shadow: 0 10px 0 #C79A5A, 0 16px 22px rgba(90,55,10,.28), inset 0 0 0 4px rgba(255,255,255,.35);
    display: flex; flex-direction: column; gap: var(--gap);
  }
  .abc-row { display: flex; justify-content: center; gap: var(--gap); }
  .abc-hole { position: relative; flex: 0 0 auto; width: var(--cs); height: var(--cs); padding: 0; border: 0; background: none; font: inherit; font-size: var(--fs); line-height: 1; display: grid; place-items: center; }
  .abc-hl { display: block; line-height: 1; color: #C9AE85; transform-origin: 50% 90%; text-shadow: 0 -2px 1px rgba(80,50,15,.6), 0 2px 1px rgba(255,248,230,.9); }
  .abc-hole.filled .abc-hl { visibility: hidden; }
  .abc-box {
    position: relative; z-index: 2; flex: 1 1 0; min-height: 0; margin: 14px 8px 8px; padding: 6px; border-radius: 26px;
    background: rgba(160,110,50,.14); box-shadow: inset 0 5px 0 rgba(120,80,30,.16);
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: var(--pgap);
  }
  .abc-pc {
    position: relative; flex: 0 0 auto; width: var(--ps); height: var(--ps); padding: 0; border: 0; background: none; font: inherit; font-size: var(--pfs); line-height: 1;
    display: grid; place-items: center; touch-action: none; z-index: 2; transition: transform .22s cubic-bezier(.3,1.5,.5,1);
  }
  .abc-pc.drag { transition: none; }
  .abc-pc.lift, .abc-pc.drag, .abc-pc.fly { z-index: 30; }
  .abc-g {
    display: block; line-height: 1; color: var(--pc); transform: rotate(var(--rot, 0deg));
    text-shadow: 0 1px 0 var(--pd), 0 2px 0 var(--pd), 0 3px 0 var(--pd), 0 4px 0 var(--pd), 0 5px 0 var(--pd), 0 6px 0 var(--pd), 0 9px 7px rgba(60,35,10,.35);
  }
  .abc-pc.lift .abc-g, .abc-pc.drag .abc-g {
    text-shadow: 0 1px 0 var(--pd), 0 2px 0 var(--pd), 0 3px 0 var(--pd), 0 4px 0 var(--pd), 0 5px 0 var(--pd), 0 6px 0 var(--pd), 0 18px 12px rgba(60,35,10,.38);
  }
  .abc-hole .abc-pc.placed { position: absolute; inset: 0; width: 100%; height: 100%; font-size: var(--fs); transition: none; z-index: 1; pointer-events: none; }
  .abc-pc.placed .abc-g { transform: none; text-shadow: 0 1px 0 var(--pd), 0 2px 0 var(--pd), 0 3px 0 var(--pd), 0 5px 4px rgba(60,35,10,.3); }
  .abc-hole.glow .abc-pc .abc-g { filter: brightness(1.35) drop-shadow(0 0 10px #fff); }
  .abc-finger { position: absolute; left: 0; top: 0; z-index: 7; display: grid; place-items: center; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.95) 0 55%, rgba(255,255,255,.7) 75%, rgba(255,255,255,0) 100%); will-change: transform, opacity; }
  .abc-finger span { display: block; line-height: 1; transform-origin: 50% 90%; will-change: transform; }
  .abc-ico { --s: clamp(44px, min(13vw, 8.5vh), 88px); display: grid; grid-auto-flow: column; place-content: center; width: var(--s); height: var(--s); border-radius: 22%;
    background: repeating-linear-gradient(92deg, rgba(139,94,40,.12) 0 2px, transparent 2px 7px), #EED9B7;
    box-shadow: 0 4px 0 #C79A5A, inset 0 0 0 2px rgba(255,255,255,.45); font-family: var(--font-abc); font-size: calc(var(--s) * .33); font-weight: 700; line-height: 1; letter-spacing: -.02em; text-shadow: 0 2px 0 rgba(60,35,10,.25); }

  /* まいにちとけい */
  #stage-clock { background: #BDE6FF; display: flex; flex-direction: column; align-items: center; padding: 72px 8px 10px; gap: 10px; }
  .ck-sky { position: absolute; inset: 0; transition: opacity .8s; }
  .ck-stars { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; pointer-events: none; }
  #stage-clock.night .ck-stars { opacity: 1; }
  .ck-stars i { position: absolute; font-style: normal; font-size: 18px; line-height: 1; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .ck-face { position: relative; z-index: 2; flex: 0 0 auto; width: min(80%, calc(100vh - 330px)); aspect-ratio: 1; touch-action: none; cursor: grab; filter: drop-shadow(0 8px 0 rgba(43,58,103,.2)); }
  .ck-face svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ck-face .num { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .ck-orb { position: absolute; left: 0; top: 0; z-index: 3; width: 48px; height: 48px; margin: -24px 0 0 -24px; font-size: 40px; line-height: 48px; text-align: center; pointer-events: none; transition: transform .25s ease-out; }
  .ck-side { position: relative; z-index: 2; flex: 0 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ck-card { width: min(100%, 460px); min-height: 96px; padding: 8px 12px; border-radius: 24px; background: #fff; box-shadow: 0 6px 0 var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .ck-emo { font-size: clamp(40px, 12vw, 64px); line-height: 1.05; letter-spacing: .06em; }
  .ck-line { font-size: clamp(16px, 4.6vw, 26px); line-height: 1.25; }
  .ck-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 460px; padding: 4px 0; }
  .ck-b { flex: 0 0 auto; width: 60px; height: 60px; padding: 0; border: 0; border-radius: 50%; background: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 0 var(--shadow); display: grid; place-items: center; transition: transform .15s; }
  .ck-b:active { transform: translateY(3px); }
  .ck-b.on { transform: scale(1.12); background: #FFE48A; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); }
  @media (min-aspect-ratio: 4/3) {
    #stage-clock { flex-direction: row; justify-content: center; padding: 12px 12px 12px 80px; gap: 28px; }
    .ck-face { width: min(52%, calc(100vh - 48px)); }
    .ck-side { width: min(44%, 460px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .slot .cur, .slot.open .an { transition-duration: .01s; transition-delay: 0s; }
    .ck-stars i, .ck-orb, .ck-sky { animation: none; transition-duration: .01s; }
  }
</style>
</head>
<body>
<div class="stages" id="stages">
  <section class="stage" id="home" aria-label="ホーム">
    <div class="homegrid" id="homegrid"></div>
  </section>

  <section class="stage" id="stage-sky" aria-label="ふうせん" hidden>
    <div class="fx" id="fx-sky"></div>
  </section>

  <section class="stage" id="stage-zoo" aria-label="どうぶつ" hidden>
    <div class="zoo" id="zoo"></div>
    <div class="fx" id="fx-zoo"></div>
  </section>

  <section class="stage" id="stage-paint" aria-label="おえかき" hidden>
    <div class="paintwrap" id="paintwrap">
      <canvas id="paper"></canvas>
      <div class="fx" id="fx-paint"></div>
    </div>
    <div class="palette" id="palette"></div>
  </section>

  <section class="stage" id="stage-touch" aria-label="いろタッチ" hidden>
    <div id="ripples"></div>
    <div class="blobs" id="blobs"></div>
  </section>

  <section class="stage" id="stage-find" aria-label="いろさがし" hidden>
    <div class="stars" id="find-stars"></div>
    <div class="ask" id="find-ask"></div>
    <div class="choices" id="find-choices"></div>
    <div class="fx" id="fx-find"></div>
  </section>

  <section class="stage" id="stage-count" aria-label="かぞえよう" hidden>
    <div class="sayline" id="count-say"></div>
    <div id="items"></div>
    <div class="fx" id="fx-count"></div>
  </section>

  <section class="stage" id="stage-num" aria-label="すうじ" hidden>
    <div class="numtop">
      <div class="bignum" id="num-big"></div>
      <div class="starsarea" id="num-stars"></div>
    </div>
    <div class="numpad" id="numpad"></div>
    <div class="fx" id="fx-num"></div>
  </section>

  <section class="stage" id="stage-baa" aria-label="いないいないばあ" hidden>
    <div class="baa" id="baa"></div>
    <div class="fx" id="fx-baa"></div>
  </section>

  <section class="stage" id="stage-shop" aria-label="おみせやさん" hidden>
    <div class="reg">
      <div class="scanbox" id="scanbox" data-arr="top">
        <div class="camarrows" id="camarrows" data-pos="top" hidden>
          <div class="grp"><i class="ar a1" style="--i:0" aria-hidden="true">⬆️</i><i class="ar a2" style="--i:1" aria-hidden="true">⬆️</i><i class="ar a3" style="--i:2" aria-hidden="true">⬆️</i><span class="camlbl">📷 ここに みせてね</span></div>
        </div>
        <div class="scanwin" id="scanwin" role="img" aria-label="スキャナーの まど"><video id="cam-video" playsinline muted autoplay hidden></video><div class="cbox" id="cbox" hidden></div><div class="laser"></div><span class="scanlbl">スキャナー</span></div>
      </div>
      <div class="regbody">
        <div class="lcd" id="lcd">
          <div class="l1"><span id="lcd-ico"></span><span class="nm" id="lcd-name">いらっしゃいませ</span><span id="lcd-price"></span></div>
          <div class="l2" id="lcd-say"></div>
          <div class="l3" id="lcd-tot"><span>ごうけい</span><span id="lcd-sum">¥0</span></div>
        </div>
        <div class="regbottom">
          <div class="basket" id="basket"></div>
          <button class="paybtn" id="paybtn" type="button" aria-label="おかいけい"><span class="pi">💴</span><span>おかいけい</span></button>
        </div>
      </div>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="paypanel" id="paypanel" hidden>
      <div class="paystat" id="paystat" aria-live="off"></div>
      <div class="coins" id="coins"></div>
      <div class="tray" id="tray"><div class="tc" id="tray-coins"></div><div class="tw" id="tray-word"></div></div>
      <div class="receipt" id="receipt" hidden><div class="rslot"></div><div class="rwin"><div class="paper" id="paper-r"></div></div></div>
    </div>
    <div class="fx" id="fx-shop"></div>
  </section>

  <section class="stage" id="stage-phone" aria-label="もしもし" hidden>
    <div class="phdisp" id="ph-disp"><span></span><span></span><span></span></div>
    <div class="say2" id="ph-say"></div>
    <div class="phkeys" id="ph-keys"></div>
    <div class="phcall" id="ph-call" hidden>
      <div class="phanimal" id="ph-animal"></div>
      <div class="phtext" id="ph-text"></div>
      <button class="hang" id="ph-hang" type="button" aria-label="ばいばい">📞</button>
    </div>
    <div class="fx" id="fx-phone"></div>
  </section>

  <section class="stage" id="stage-shape" aria-label="かたちはめ" hidden>
    <div class="board" id="board"></div>
    <div class="say2" id="shape-say"></div>
    <div class="tray2" id="pieces"></div>
    <div class="fx" id="fx-shape"></div>
  </section>

  <section class="stage" id="stage-train" aria-label="でんしゃ" hidden>
    <div class="tcols" id="tcols"></div>
    <div class="tfield" id="tfield">
      <div class="rail"></div>
      <div class="train" id="train"></div>
    </div>
    <div class="tgo"><button class="gobtn" id="gobtn" type="button" aria-label="しゅっぱつ"><span>🚦</span><span>しゅっぱつ！</span></button></div>
    <div class="fx" id="fx-train"></div>
  </section>

  <section class="stage" id="stage-nurie" hidden>
    <div class="nu-main">
      <div class="nu-card" id="nu-card"><svg id="nu-svg" viewBox="0 0 400 400" role="img" aria-label="ぬりえ"></svg></div>
      <button class="nu-nav" id="nu-prev" type="button" aria-label="まえの え">◀</button>
      <div class="nu-name" id="nu-name"></div>
      <button class="nu-nav" id="nu-next" type="button" aria-label="つぎの え">▶</button>
    </div>
    <div class="palette" id="nu-pal"></div>
    <div class="fx" id="fx-nurie"></div>
  </section>

  <section class="stage" id="stage-aiueo" hidden>
    <div class="ai-top" id="ai-top">
      <button class="ai-card" id="ai-card" type="button" aria-label="もういちど">
        <span class="ai-row"><span class="ai-l" id="ai-l"></span><span class="ai-e" id="ai-e"></span></span>
        <span class="ai-w" id="ai-w"></span>
      </button>
      <button class="ai-tb" id="ai-tb" type="button">✍️ なぞる</button>
      <div class="ai-trace" id="ai-trace" hidden>
        <div class="ai-tl" id="ai-tl"></div>
        <canvas id="ai-cv"></canvas>
        <button class="ai-back" id="ai-back" type="button">✖ もどる</button>
        <button class="ai-done" id="ai-done" type="button">できた！</button>
      </div>
    </div>
    <div class="ai-ctl">
      <div class="ai-strip">
        <button class="ai-arrow" id="ai-prev" type="button" aria-label="まえの ぎょう">◀</button>
        <div class="ai-tabs" id="ai-tabs"></div>
        <button class="ai-arrow" id="ai-next" type="button" aria-label="つぎの ぎょう">▶</button>
      </div>
      <div class="ai-btns" id="ai-btns"></div>
    </div>
    <div class="fx" id="fx-aiueo"></div>
  </section>

  <section class="stage" id="stage-abc" aria-label="ABCパズル" hidden>
    <div class="abc-nav"><span class="abc-range" id="abc-range"></span></div>
    <div class="abc-board" id="abc-board"></div>
    <div class="abc-box" id="abc-box"></div>
    <div class="fx" id="fx-abc"></div>
  </section>

  <section class="stage" id="stage-clock" aria-label="まいにちとけい" hidden>
    <div class="ck-sky" id="ck-sky-a"></div>
    <div class="ck-sky" id="ck-sky-b" style="opacity:0"></div>
    <div class="ck-stars" id="ck-stars"></div>
    <div class="ck-face" id="ck-face" data-hour="7" role="img" aria-label="とけい">
      <svg id="ck-svg" viewBox="-100 -100 200 200">
        <circle r="98" fill="#FF8A5B"/>
        <circle r="98" fill="none" stroke="#FFC83D" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" transform="scale(.93)"/>
        <circle r="86" fill="#fff" stroke="#2B3A67" stroke-opacity=".15" stroke-width="2"/>
        <g id="ck-ticks"></g>
        <g id="ck-nums"></g>
        <g id="ck-mhand"><line x1="0" y1="6" x2="0" y2="-56" stroke="#2F7BF5" stroke-width="5" stroke-linecap="round"/></g>
        <g id="ck-hhand"><line x1="0" y1="4" x2="0" y2="-38" stroke="#F2463C" stroke-width="11" stroke-linecap="round"/><circle cx="0" cy="-38" r="7" fill="#F2463C"/><circle r="14" fill="#F2463C"/></g>
        <circle id="ck-hub" r="7" fill="#FFD21F" stroke="#2B3A67" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="ck-orb" id="ck-orb" aria-hidden="true">🌞</div>
    <div class="ck-side">
      <div class="ck-card" id="ck-card"><div class="ck-emo" id="ck-emo"></div><div class="ck-line" id="ck-line"></div></div>
      <div class="ck-btns" id="ck-btns"></div>
    </div>
    <div class="fx" id="fx-clock"></div>
  </section>

  <div id="bigword" aria-live="polite" hidden></div>

  <button class="tool homebtn" id="homebtn" type="button" aria-label="ホームへ" hidden>🏠</button>
  <div class="tools">
    <button class="tool" id="clear" type="button" aria-label="けす" hidden>🧽</button>
    <button class="tool lp" id="setbtn" type="button" aria-label="せってい（おとなよう・ながおし）" title="ながおしで ひらく">⚙️</button>
  </div>

  <div class="setsheet" id="setsheet" role="dialog" aria-label="せってい" hidden>
    <div class="sethead"><h2>せってい（おとなよう）</h2><button class="setx" id="setx" type="button" aria-label="とじる">✖</button></div>
    <div class="setbody">
      <div class="setgrp"><h3>おと</h3>
        <div class="seg" data-k="sound"><button type="button" data-v="1">あり</button><button type="button" data-v="0">なし</button></div></div>
      <div class="setgrp"><h3>こえ（よみあげ）</h3>
        <div class="seg" data-k="voice"><button type="button" data-v="1">あり</button><button type="button" data-v="0">なし</button></div>
        <p class="note">「なし」だと こうかおん だけに なります。</p></div>
      <div class="setgrp"><h3>おみせやさん カメラ</h3>
        <div class="seg" data-k="camOn"><button type="button" data-v="1">つかう</button><button type="button" data-v="0">つかわない</button></div>
        <p class="sub">かんど: <span id="thr-val">3</span>（1〜5、5が いちばん びんかん）</p>
        <input type="range" id="thr" min="1" max="5" step="1" value="3" aria-label="かんど">
        <p class="sub">カメラの いち（やじるしの むき）</p>
        <div class="seg" data-k="camPos"><button type="button" data-v="top">うえ</button><button type="button" data-v="left">ひだり</button><button type="button" data-v="right">みぎ</button><button type="button" data-v="bottom">した</button></div>
        <button class="sbtn" id="cam-test" type="button">カメラをためす</button>
        <p class="setmsg" id="cam-msg" hidden>カメラが つかえません（ブラウザの せっていで きょかしてください）</p>
        <div class="diag" id="diag" hidden>
          <canvas id="diag-cv" width="160" height="120" aria-label="カメラの しんだん"></canvas>
          <div class="dbar"><i class="dfill" id="dfill"></i><i class="dthr" id="dthr"></i></div>
          <div class="dstate" id="dstate" aria-live="off">カメラなし</div>
        </div>
        <video id="set-video" playsinline muted autoplay></video>
      </div>
      <div class="setgrp"><h3>ABC パズル</h3>
        <div class="seg" data-k="abcAll"><button type="button" data-v="0">4もじずつ</button><button type="button" data-v="1">ぜんぶ</button></div>
        <p class="sub">はじめる もじ</p>
        <div class="seg" data-k="abcStart"><button type="button" data-v="0">A–D</button><button type="button" data-v="1">E–H</button><button type="button" data-v="2">I–L</button><button type="button" data-v="3">M–P</button><button type="button" data-v="4">Q–T</button><button type="button" data-v="5">U–X</button><button type="button" data-v="6">Y–Z</button></div></div>
      <div class="setgrp"><h3>とけい</h3>
        <p class="sub">いまの じかんで はじめる</p>
        <div class="seg" data-k="clockNow"><button type="button" data-v="0">オフ</button><button type="button" data-v="1">オン</button></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- きょうつうデータ ---------- */
  var DARK = '#2B3A67';
  var COL = [
    { k: 'red',    v: 'あか',     c: '#F2463C', fg: '#FFFFFF' },
    { k: 'blue',   v: 'あお',     c: '#2F7BF5', fg: '#FFFFFF' },
    { k: 'yellow', v: 'きいろ',   c: '#FFD21F', fg: DARK },
    { k: 'green',  v: 'みどり',   c: '#34B556', fg: '#FFFFFF' },
    { k: 'pink',   v: 'ピンク',   c: '#FF7EB6', fg: DARK },
    { k: 'orange', v: 'オレンジ', c: '#FF9124', fg: DARK },
    { k: 'purple', v: 'むらさき', c: '#9358E0', fg: '#FFFFFF' },
    { k: 'brown',  v: 'ちゃいろ', c: '#9A5B32', fg: '#FFFFFF' }
  ];
  var NUMV = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう'];
  var SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5, 1174.66, 1318.51];

  /* ---------- せってい（おとなよう）。localStorage: ponpon.settings.v1。「おと なし」「こえ なし」は ほぞんしない ---------- */
  var SET_KEY = 'ponpon.settings.v1';
  var S = { sound: true, voice: true, camOn: true, sens: 3, camPos: 'top', abcAll: false, abcStart: 0, clockNow: false };
  (function () {
    try {
      var o = JSON.parse(window.localStorage.getItem(SET_KEY) || 'null');
      if (o && typeof o === 'object') {
        if (typeof o.camOn === 'boolean') S.camOn = o.camOn;
        if (o.sens >= 1 && o.sens <= 5) S.sens = Math.round(o.sens);
        if (/^(top|left|right|bottom)$/.test(o.camPos)) S.camPos = o.camPos;
        if (typeof o.abcAll === 'boolean') S.abcAll = o.abcAll;
        if (o.abcStart >= 0 && o.abcStart <= 6) S.abcStart = Math.round(o.abcStart);
        if (typeof o.clockNow === 'boolean') S.clockNow = o.clockNow;
      }
    } catch (e) {}
  })();
  function saveSettings() {
    try {
      window.localStorage.setItem(SET_KEY, JSON.stringify({ camOn: S.camOn, sens: S.sens, camPos: S.camPos, abcAll: S.abcAll, abcStart: S.abcStart, clockNow: S.clockNow }));
    } catch (e) {}
  }

  /* ---------- おと ---------- */
  var ac = null, muted = false, voiceOff = false, setOpen = false;
  function quiet() { return muted || setOpen; }   /* おとなし／せってい を ひらいている あいだは ゲームの おとを ならさない */
  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  ['pointerdown', 'pointerup', 'touchend', 'click'].forEach(function (ev) {
    document.addEventListener(ev, function () { audio(); }, { passive: true });
  });
  function tone(f, d, type, v, to, delay) {
    var c = audio(); if (!c || quiet()) return;
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v || 0.18, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  }
  function popSound() {
    var c = audio(); if (!c || quiet()) return;
    var len = Math.floor(c.sampleRate * 0.12);
    var buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(900, 1700);
    var g = c.createGain(); g.gain.value = 0.55;
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start();
    tone(rand(520, 900), 0.09, 'triangle', 0.14, 220);
  }
  function arpeggio() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, 0.28, 'triangle', 0.16, 0, i * 0.09); });
  }
  function poyon() { tone(300, 0.25, 'sine', 0.15, 200); }
  function countTone(n) { tone(SCALE[Math.max(0, Math.min(9, n - 1))], 0.22, 'triangle', 0.18); }
  function say(text) {
    if (quiet() || voiceOff || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 0.9; u.pitch = 1.5; u.volume = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- タイマー（ゲームを出るときにまとめて解除） ---------- */
  var timers = {}, tid = 0;
  function later(fn, ms) {
    var id = ++tid;
    timers[id] = setTimeout(function () { delete timers[id]; fn(); }, ms);
    return id;
  }
  function cancel(id) { if (timers[id]) { clearTimeout(timers[id]); delete timers[id]; } }
  function clearTimers() {
    for (var k in timers) { if (timers.hasOwnProperty(k)) clearTimeout(timers[k]); }
    timers = {};
  }

  /* ---------- きらきら・おおきなことば ---------- */
  function burst(layer, x, y, opts) {
    var n = opts.n || 10;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('span');
      var ang = (Math.PI * 2 * i) / n + rand(-0.3, 0.3);
      var dist = rand(50, 120) * (opts.far || 1);
      if (opts.emoji) { el.textContent = opts.emoji[i % opts.emoji.length]; el.style.fontSize = rand(20, 34) + 'px'; }
      else { el.className = 'dot'; el.style.background = opts.colors[i % opts.colors.length]; }
      layer.appendChild(el);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      var a = el.animate([
        { transform: 'translate(' + x + 'px,' + y + 'px) scale(1)', opacity: 1 },
        { transform: 'translate(' + (x + dx) + 'px,' + (y + dy) + 'px) scale(0.3)', opacity: 0 }
      ], { duration: reduce ? 300 : 650, easing: 'ease-out' });
      a.onfinish = (function (e) { return function () { e.remove(); }; })(el);
    }
  }
  function floatWord(layer, x, y, text) {
    var el = document.createElement('span');
    el.className = 'word'; el.textContent = text;
    layer.appendChild(el);
    var a = el.animate([
      { transform: 'translate(' + x + 'px,' + y + 'px) scale(.6)', opacity: 0 },
      { transform: 'translate(' + x + 'px,' + (y - 20) + 'px) scale(1.15)', opacity: 1, offset: 0.25 },
      { transform: 'translate(' + x + 'px,' + (y - 70) + 'px) scale(1)', opacity: 0 }
    ], { duration: 800, easing: 'ease-out' });
    a.onfinish = function () { el.remove(); };
  }
  function centerIn(el, layer) {
    var r = el.getBoundingClientRect(), s = layer.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
  }
  function wiggle(el, deg) {
    el.animate([
      { transform: 'rotate(0)' }, { transform: 'rotate(' + (-deg) + 'deg)' }, { transform: 'rotate(' + deg + 'deg)' },
      { transform: 'rotate(' + (-deg / 2) + 'deg)' }, { transform: 'rotate(0)' }
    ], { duration: reduce ? 150 : 420, easing: 'ease-out' });
  }
  function bounce(el, up) {
    el.animate([
      { transform: 'translateY(0) scale(1)' },
      { transform: 'translateY(' + (-up) + 'px) scale(1.15, .92)', offset: 0.4 },
      { transform: 'translateY(0) scale(.94, 1.06)', offset: 0.75 },
      { transform: 'translateY(0) scale(1)' }
    ], { duration: reduce ? 150 : 460, easing: 'ease-out' });
  }
  function onTap(el, fn) {
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); audio(); fn(e); });
    el.addEventListener('click', function (e) { if (e.detail === 0) fn(e); });
  }

  /* 長押しボタン（おとなだけが切り替えられる）: 進捗リングが一周したら done() */
  function holdButton(btn, ms, done) {
    var t0 = 0, raf = 0, tm = 0, on = false;
    function frame() {
      if (!on) return;
      btn.style.setProperty('--p', Math.min(1, (performance.now() - t0) / ms).toFixed(3));
      raf = requestAnimationFrame(frame);
    }
    function start() {
      if (on) return;
      on = true; t0 = performance.now();
      btn.classList.add('hold'); btn.style.setProperty('--p', '0');
      raf = requestAnimationFrame(frame);
      tm = setTimeout(function () { finish(true); }, ms);
    }
    function finish(ok) {
      if (!on) return;
      on = false; clearTimeout(tm); cancelAnimationFrame(raf);
      btn.classList.remove('hold'); btn.style.setProperty('--p', '0');
      if (ok) done(); else wiggle(btn, 10);
    }
    btn.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault(); audio(); start();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      btn.addEventListener(ev, function () { finish(false); });
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); if (!e.repeat) start(); }
    });
    btn.addEventListener('keyup', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); finish(false); }
    });
    btn.addEventListener('blur', function () { finish(false); });
    btn.addEventListener('click', function (e) { e.preventDefault(); });
  }

  var bw = $('#bigword'), bwAnim = null;
  function hideWord() {
    if (bwAnim) { try { bwAnim.cancel(); } catch (e) {} bwAnim = null; }
    bw.hidden = true;
  }
  function bigWord(text, color) {
    if (bwAnim) { try { bwAnim.cancel(); } catch (e) {} }
    bw.textContent = text;
    bw.style.color = color || DARK;
    bw.hidden = false;
    bwAnim = bw.animate([
      { opacity: 0, transform: 'translate(0,-50%) scale(.6)' },
      { opacity: 1, transform: 'translate(0,-50%) scale(1.12)', offset: 0.2 },
      { opacity: 1, transform: 'translate(0,-50%) scale(1)', offset: 0.7 },
      { opacity: 0, transform: 'translate(0,-50%) scale(1)' }
    ], { duration: reduce ? 700 : 1200, easing: 'ease-out', fill: 'forwards' });
    var mine = bwAnim;
    mine.onfinish = function () { if (bwAnim === mine) { bw.hidden = true; bwAnim = null; } };
  }

  /* ---------- ゲーム登録 ---------- */
  var games = {}, cur = null;

  /* ====== 1. ふうせん ====== */
  var sky = $('#stage-sky'), fxSky = $('#fx-sky');
  var BCOLS = COL.filter(function (c) { return c.k !== 'brown'; });
  var balloons = [], W = 0, H = 0, raf = 0, last = 0;
  function target() { return W < 520 ? 6 : 10; }
  function reset(b, initial) {
    var small = W < 400;
    b.s = small ? rand(84, 114) : rand(100, 134);
    b.h = b.s * 1.2 + 76;
    b.x = rand(8, Math.max(9, W - b.s - 8));
    b.y = initial ? rand(-20, Math.max(0, H - b.h)) : H + rand(20, 160);
    b.v = rand(26, 48);
    b.ph = rand(0, 6.28);
    b.t = 0;
    b.col = pick(BCOLS);
    b.c = b.col.c;
    b.el.style.setProperty('--s', b.s + 'px');
    b.el.style.setProperty('--c', b.c);
  }
  function addBalloon(initial) {
    var el = document.createElement('div');
    el.className = 'balloon';
    el.innerHTML = '<div class="body"></div><div class="string"></div>';
    var b = { el: el };
    el.__b = b;
    reset(b, initial);
    sky.insertBefore(el, fxSky);
    balloons.push(b);
    return b;
  }
  function measureSky() { W = sky.clientWidth; H = sky.clientHeight; }
  function tick(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    for (var i = 0; i < balloons.length; i++) {
      var b = balloons[i];
      b.y -= b.v * dt; b.t += dt;
      var sx = reduce ? 0 : Math.sin(b.t * 1.1 + b.ph) * 14;
      b.el.style.transform = 'translate3d(' + (b.x + sx) + 'px,' + b.y + 'px,0)';
      if (b.y < -b.h - 20) reset(b, false);
    }
    raf = requestAnimationFrame(tick);
  }
  sky.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    audio();
    var el = e.target.closest ? e.target.closest('.balloon') : null;
    if (!el || !el.__b) return;
    var b = el.__b;
    var cx = b.x + b.s / 2, cy = b.y + b.s * 0.6;
    burst(fxSky, cx, cy, { n: 12, colors: [b.c, '#FFFFFF', '#FFC83D'] });
    popSound();
    say(b.col.v);
    bigWord(b.col.v + '！', b.c);
    balloons.splice(balloons.indexOf(b), 1);
    el.remove();
    later(function () { if (balloons.length < target()) addBalloon(false); }, 450);
  });
  games.sky = {
    el: sky,
    enter: function () {
      measureSky();
      while (balloons.length < target()) addBalloon(true);
      cancelAnimationFrame(raf);
      last = performance.now();
      raf = requestAnimationFrame(tick);
    },
    leave: function () { cancelAnimationFrame(raf); raf = 0; },
    resize: function () {
      measureSky();
      balloons.forEach(function (b) { b.x = Math.min(b.x, Math.max(8, W - b.s - 8)); });
    }
  };

  /* ====== 2. どうぶつ ====== */
  var ANIMALS = [
    { e: '🐶', n: 'いぬ',   w: 'わんわん', c: 'var(--card-yellow)', s: [[330, .12, 'sawtooth', .13, 200, 0], [330, .12, 'sawtooth', .13, 200, .22]] },
    { e: '🐱', n: 'ねこ',   w: 'にゃーお', c: 'var(--card-pink)',   s: [[600, .42, 'sine', .2, 900, 0], [900, .32, 'sine', .18, 500, .4]] },
    { e: '🐮', n: 'うし',   w: 'もーもー', c: 'var(--card-mint)',   s: [[150, .8, 'triangle', .28, 115, 0], [150, .8, 'triangle', .22, 115, .9]] },
    { e: '🐥', n: 'ひよこ', w: 'ぴよぴよ', c: 'var(--card-peach)',  s: [[1500, .07, 'sine', .15, 1900, 0], [1700, .07, 'sine', .15, 2100, .11], [1500, .07, 'sine', .15, 1900, .3], [1700, .07, 'sine', .15, 2100, .41]] },
    { e: '🐸', n: 'かえる', w: 'けろけろ', c: 'var(--card-blue)',   s: [[190, .08, 'square', .08, 120, 0], [190, .08, 'square', .08, 120, .13], [190, .08, 'square', .08, 120, .26]] },
    { e: '🐘', n: 'ぞう',   w: 'ぱおーん', c: 'var(--card-lilac)',  s: [[350, .15, 'sawtooth', .1, 520, 0], [520, .7, 'sawtooth', .11, 380, .15]] }
  ];
  var zoo = $('#zoo'), zooStage = $('#stage-zoo'), fxZoo = $('#fx-zoo');
  ANIMALS.forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.style.setProperty('--c', a.c);
    b.setAttribute('aria-label', a.n);
    b.innerHTML = '<span class="emoji">' + a.e + '</span><span class="name">' + a.n + '</span>';
    function play() {
      audio();
      a.s.forEach(function (p) { tone(p[0], p[1], p[2], p[3], p[4], p[5]); });
      say(a.w);
      b.animate([
        { transform: 'scale(1) rotate(0)' },
        { transform: 'scale(1.14) rotate(-6deg)' },
        { transform: 'scale(.95) rotate(5deg)' },
        { transform: 'scale(1.07) rotate(-3deg)' },
        { transform: 'scale(1) rotate(0)' }
      ], { duration: reduce ? 200 : 600, easing: 'ease-out' });
      var bubble = document.createElement('span');
      bubble.className = 'say'; bubble.textContent = a.w;
      b.appendChild(bubble);
      var an = bubble.animate([
        { transform: 'translate(-50%, 8px) scale(.7)', opacity: 0 },
        { transform: 'translate(-50%, 0) scale(1.05)', opacity: 1, offset: 0.2 },
        { transform: 'translate(-50%, 0) scale(1)', opacity: 1, offset: 0.75 },
        { transform: 'translate(-50%, -8px) scale(1)', opacity: 0 }
      ], { duration: 1300, easing: 'ease-out' });
      an.onfinish = function () { bubble.remove(); };
      var r = b.getBoundingClientRect(), s = zooStage.getBoundingClientRect();
      burst(fxZoo, r.left - s.left + r.width / 2, r.top - s.top + r.height / 2, { n: 8, emoji: ['✨', '⭐', '💛'] });
    }
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); play(); });
    b.addEventListener('click', function (e) { if (e.detail === 0) play(); });
    zoo.appendChild(b);
  });
  games.zoo = { el: zooStage, enter: function () {}, leave: function () {} };

  /* ====== 3. おえかき ====== */
  var paintStage = $('#stage-paint'), paintWrap = $('#paintwrap'), cv = $('#paper'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2), hue = 0, brush = 28, pw = 0, ph = 0;
  var ptrs = {}, lastNote = 0, introDone = false, penColor = null;
  var NOTES = [262, 294, 330, 392, 440, 523, 587, 659, 784];
  function sizeCanvas() {
    var w = paintWrap.clientWidth, h = paintWrap.clientHeight;
    if (!w || !h) return false;
    var nw = Math.round(w * dpr), nh = Math.round(h * dpr);
    if (cv.width !== nw || cv.height !== nh) {
      var tmp = document.createElement('canvas');
      tmp.width = cv.width; tmp.height = cv.height;
      if (cv.width) tmp.getContext('2d').drawImage(cv, 0, 0);
      cv.width = nw; cv.height = nh;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (tmp.width) ctx.drawImage(tmp, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    pw = w; ph = h;
    brush = Math.max(24, Math.min(w, h) * 0.07);
    return true;
  }
  function drawIntro() {
    var cx = pw / 2, cy = ph * 0.82, base = Math.min(pw * 0.42, ph * 0.38);
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(16, base * 0.11);
    for (var i = 0; i < 6; i++) {
      ctx.strokeStyle = 'hsl(' + (i * 55) + ',90%,60%)';
      ctx.beginPath();
      ctx.arc(cx, cy, base - i * ctx.lineWidth * 1.05, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
  }
  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function note(x) {
    var now = performance.now();
    if (now - lastNote < 130) return;
    lastNote = now;
    var i = Math.max(0, Math.min(NOTES.length - 1, Math.floor((x / (pw || 1)) * NOTES.length)));
    tone(NOTES[i], 0.28, 'sine', 0.11);
  }
  function inkNow() { return penColor || ('hsl(' + hue + ',90%,60%)'); }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); audio();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pos(e);
    hue = (hue + rand(40, 120)) % 360;
    ptrs[e.pointerId] = { x: p.x, y: p.y };
    ctx.fillStyle = inkNow();
    ctx.beginPath(); ctx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2); ctx.fill();
    note(p.x);
    burst($('#fx-paint'), p.x, p.y, { n: 6, emoji: ['✨', '⭐'] });
  });
  cv.addEventListener('pointermove', function (e) {
    var l = ptrs[e.pointerId]; if (!l) return;
    var p = pos(e);
    hue = (hue + 4) % 360;
    ctx.strokeStyle = inkNow();
    ctx.lineWidth = brush; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    l.x = p.x; l.y = p.y;
    note(p.x);
  });
  function endPtr(e) { delete ptrs[e.pointerId]; }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  $('#clear').addEventListener('click', function () {
    if (cur !== 'paint') return;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
    tone(700, 0.2, 'triangle', 0.12, 300);
  });

  /* まんなかの まるを タップ: 「ボーン」を いまの じかん（12じかんせい）の かいすう */

  }
  /* とけいの なかを ドラッグ → みじかい はりが ゆびの かくどに ついてくる。はなすと ちかい 〜じに カチッ */
  function ckGeom() { var r = ckFace.getBoundingClientRect(); return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, R: r.width / 2 }; }
